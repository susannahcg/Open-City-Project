<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open City Project | Project gallery</title>
    <style>
        /* Basic reset and typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #e37d61;
        }
        header {
            background-color: #46494d; /* GitHub-style dark grey */
            color: #ebe9e8;
            padding: 2rem 1rem;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            color: #cfc5c2;
        }
        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Main Content / Gallery Styling */
        .main-content {
            margin-left: 250px; /* Matches the width of the sidebar to prevent overlap */
            padding: 40px;
            flex-grow: 1;
        }

        .main-content h2 {
            margin-bottom: 20px;
            color: #46494d;
        }

        /* Image Gallery Masonry Layout */
        .image-gallery {
            /* Sets column width and gap; lets browser decide column count dynamically */
            column-width: 250px; 
            column-gap: 10px;
        }

        .gallery-item {
            /* Prevents a single item from splitting across columns */
            break-inside: avoid; 
            margin-bottom: 10px; /* Vertical gap between items */
            overflow: hidden;
            border-radius: 2px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .gallery-item:hover {
            transform: scale(1.03);
        }

        .gallery-item img {
            width: 100%;
            height: auto; /* Maintains natural aspect ratio */
            display: block;
        }
    </style>
</head>
<body>
